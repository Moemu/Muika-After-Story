[project]
name = "muika-after-story"
dynamic = ["version"]
description = "Muika-After-Story 的核心包，包含协议模型和启动函数，可以用于编写适用于任何平台的适配器实现"
readme = "README.md"
requires-python = ">=3.10.0, <3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.0",
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "arclet-alconna>=1.8.0",
    "feedparser>=6.0.12",
    "fleep>=1.0.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.0",
    "mcp[cli]>=1.26.0",
    "openai>=2.15.0",
    "pillow>=12.1.1",
    "opencv-python>=4.11.0",
    "plyer>=2.1.0",
    "psutil>=7.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyperclip>=1.9.0",
    "pywin32>=311; sys_platform == 'win32'",
    "sqlalchemy>=2.0.46",
    "trafilatura>=2.0.0",
    "watchdog>=6.0.0",
]
authors = [
    { name = "Moemu", email = "i@snowy.moe" },
]

[project.optional-dependencies]
standard = [
    "azure-ai-inference>=1.0.0b9",
    "dashscope>=1.26.7",
    "google-genai>=1.8.0",
    "ollama>=0.4.7",
    "soundfile>=0.13.1",
    "pytz>=2025.2"
]
nonebot = [
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-alconna>=0.60.4",
    "nonebot-plugin-session>=0.3.2",
    "nonebot-plugin-userinfo>=0.2.6",
    "nonebot2[fastapi]>=2.4.4",
]
dev = [
    "pre-commit>=4.1.0",
    "mypy>=1.15.0",
    "black>=25.1.0",
    "types-PyYAML",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --cov=muika --cov-report=term-missing"

# 覆盖率只统计 core 的可测试逻辑；以下为明确不做单元测试的集成/框架层
# （provider 适配器、IPC、迁移、插件框架、内置命令、OS/网络工具、引导/日志，
# 以及 loop.py 的事件循环编排——整个文件跳过，避免逐函数维护 pragma）。
[tool.coverage.run]
omit = [
    "muika/llm/providers/*",
    "muika/ipc/*",
    "muika/migrations/*",
    "muika/plugin/*",
    "muika/builtin_plugins/*",
    "muika/core/actions/tools/*",
    "muika/core/loop.py",
    "muika/utils/first_run.py",
    "muika/utils/logger.py",
]

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "scm"
tag_filter = "v*"
tag_regex = '^v(?:\D*)?(?P<version>([1-9][0-9]*!)?(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))*((a|b|c|rc)(0|[1-9][0-9]*))?(\.post(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?$)$'
fallback_version = "1.0.0"

[tool.pdm.build]
includes = ["muika"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
