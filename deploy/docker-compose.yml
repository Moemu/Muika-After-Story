services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: muika-napcat
    restart: unless-stopped
    ports:
      - "3000:3000"     # OneBot HTTP API
      - "3001:3001"     # OneBot WebSocket （muika-bot 连接此端口）
      - "6099:6099"     # NapCat WebUI —— 管理后台，首次扫码登录用
    volumes:
      # QQ 持久化数据（登录态、聊天记录缓存等）
      - ./napcat/QQ:/app/.config/QQ
      # NapCat 配置文件（webui 修改后自动保存至此）
      - ./napcat/config:/app/napcat/config
      # NapCat 插件目录
      - ./napcat/plugins:/app/napcat/plugins
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
