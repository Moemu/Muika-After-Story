services:
  muika-bot:
    build:
      context: ..
      dockerfile: deploy/bot.Dockerfile
      args:
        BOT_EXTRA_DEPENDENCIES: ${BOT_EXTRA_DEPENDENCIES:-}
    restart: unless-stopped
    volumes:
      - ../.env:/app/.env:ro
      - ../data:/app/data
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
