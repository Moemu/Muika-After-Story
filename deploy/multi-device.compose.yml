name: muika
# 三个服务共用同一镜像；OneBot 之外的个人适配器通过 BOT_EXTRA_DEPENDENCIES 构建参数注入
services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BOT_EXTRA_DEPENDENCIES: ${BOT_EXTRA_DEPENDENCIES:-}
    image: mas-runtime-local
    command: ["python", "-m", "muika.ipc.gateway", "--host", "0.0.0.0"]
    env_file: ../.env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

  core:
    image: mas-runtime-local
    # 源码形态：父进程入口保持轻量（core_main.py），运行树来自宿主 checkout
    command: ["python", "core_main.py"]
    working_dir: /app-src
    stop_grace_period: 190s
    env_file: ../.env
    environment:
      GATEWAY_URL: ws://gateway:8765/cores
      CORE_NODE_NAME: server
      CORE_PRIORITY: 0
      LOCAL_FALLBACK: "false"
      # 受管数据固定落在卷上：数据库、工作区树、boot 指针与回滚记录都在这里
      DATA_DIR: /app/data
      PYTHONPATH: /app-src
    volumes:
      # 整棵源码树可写：promotion 会写回这里（持久），git pull 也更新这里
      - ${MAS_SOURCE_DIR:-..}:/app-src
      - core-data:/app/data
    restart: unless-stopped
    depends_on:
      - gateway

  bot:
    image: mas-runtime-local
    command: ["python", "bot.py"]
    env_file: ../.env
    environment:
      CORE_WS_URL: ws://gateway:8765/ws
    volumes:
      - bot-data:/app/data
      - ../.env:/app/.env:ro
    restart: unless-stopped
    depends_on:
      - gateway

volumes:
  gateway-data:
  core-data:
  bot-data:
