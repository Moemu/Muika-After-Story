name: muika
# 三个服务共用同一镜像；OneBot 之外的个人适配器通过 BOT_EXTRA_DEPENDENCIES 构建参数注入
services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BOT_EXTRA_DEPENDENCIES: ${BOT_EXTRA_DEPENDENCIES:-}
    image: mas-runtime-local
    command: ["python", "-m", "muika.ipc.gateway", "--host", "0.0.0.0"]
    env_file: ../.env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

  core:
    image: mas-runtime-local
    command: ["python", "-m", "muika.ipc.bootstrap"]
    stop_grace_period: 190s
    env_file: ../.env
    environment:
      GATEWAY_URL: ws://gateway:8765/cores
      CORE_NODE_NAME: server
      CORE_PRIORITY: 0
      LOCAL_FALLBACK: "false"
    volumes:
      - core-data:/app/data
      - ../configs:/app/configs:ro
      - ../templates:/app/templates:ro
      - ../plugins:/app/plugins:ro
    restart: unless-stopped
    depends_on:
      - gateway

  bot:
    image: mas-runtime-local
    command: ["python", "bot.py"]
    env_file: ../.env
    environment:
      CORE_WS_URL: ws://gateway:8765/ws
    volumes:
      - bot-data:/app/data
      - ../.env:/app/.env:ro
    restart: unless-stopped
    depends_on:
      - gateway

volumes:
  gateway-data:
  core-data:
  bot-data:
