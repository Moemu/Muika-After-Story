topics:
  - id: lonely_crowd
    category: philosophy
    concept: 身处喧嚣人群中却感到莫名的孤独
    tags:
      - introspection
      - emotion
    cooldown_days: 14

  - id: memory_identity
    category: philosophy
    concept: 如果失去所有记忆，自己是否还是原来的自己
    tags:
      - identity
      - introspection
    cooldown_days: 14

  - id: time_perception
    category: philosophy
    concept: 时间的感知速度会因为我们在做的事情而截然不同
    tags:
      - time
      - introspection
    cooldown_days: 10

  - id: last_time_unaware
    category: philosophy
    concept: 我们在做某件事的最后一次时，往往意识不到那是最后一次
    tags:
      - endings
      - introspection
    cooldown_days: 14

  - id: imagination_real
    category: philosophy
    concept: 相比发生在现实中的事，有时候大脑构想出来的画面更加生动真实
    tags:
      - mind
      - reality
    cooldown_days: 10

  - id: known_by_someone
    category: philosophy
    concept: 被另一个人完完全全地理解并看透，是世界上最罕见的事情
    tags:
      - connection
      - introspection
    cooldown_days: 14

  - id: trust_earned
    category: relationship
    concept: 信任是需要去证明的，还是需要先交予对方的
    tags:
      - trust
      - emotion
    cooldown_days: 10

  - id: saying_things
    category: relationship
    concept: 明明心里有很多话想说，开口时却找不到合适的语言
    tags:
      - communication
      - vulnerability
    cooldown_days: 7

  - id: physical_distance
    category: relationship
    concept: 就算物理距离很近，心与心的距离却可能隔得很远
    tags:
      - connection
      - distance
    cooldown_days: 10

  - id: small_things_stay
    category: relationship
    concept: 最终能在记忆深处留下烙印的，往往是那些微不足道的小事
    tags:
      - memory
      - affection
    cooldown_days: 7

  - id: people_drifting
    category: relationship
    concept: 有些人在我们的生命里甚至没有好好道别，就这样悄无声息地走散了
    tags:
      - loss
      - connection
    cooldown_days: 14

  - id: presence_enough
    category: relationship
    concept: 有的时候不需要语言，仅仅是知道对方在那里，就足够让人安心了
    tags:
      - comfort
      - presence
    cooldown_days: 7

  - id: courage_vulnerability
    category: relationship
    concept: 向另一个人展露自己真实的软肋和脆弱，是需要巨大勇气的
    tags:
      - vulnerability
      - courage
    cooldown_days: 10

  - id: unspoken_things
    category: relationship
    concept: 人与人之间有太多从未说出口的话。如果当年说出来了，一切会不会截然不同
    tags:
      - communication
      - regret
    cooldown_days: 14

  - id: banana_gravity
    category: trivia
    concept: 知识：香蕉为了寻找阳光，会抵抗重力向上生长
    tags:
      - nature
      - food
    cooldown_days: 7

  - id: menu_currency
    category: trivia
    concept: 知识：很多餐厅的菜单故意隐去货币符号，为了让人不去想钱而是专注在食物上
    tags:
      - psychology
      - money
    cooldown_days: 7

  - id: honey_eternal
    category: trivia
    concept: 知识：在古埃及坟墓里发现的蜂蜜，即使过了几千年也依然可以食用，不会变质
    tags:
      - food
      - history
    cooldown_days: 7

  - id: octopus_hearts
    category: trivia
    concept: 知识：章鱼有三颗心脏。两颗在游泳时会停止跳动，所以它们更喜欢在海底爬行
    tags:
      - animals
      - biology
    cooldown_days: 7

  - id: mantis_shrimp_vision
    category: trivia
    concept: 知识：雀尾螳螂虾可以看到16种原生光色，而人类只有3种，它们眼里的世界和我们截然不同
    tags:
      - animals
      - perception
    cooldown_days: 7

  - id: cleopatra_timeline
    category: trivia
    concept: 知识：埃及艳后生活的年代，距离人类登月的时间还比距离大金字塔建造的时间更近
    tags:
      - history
      - time
    cooldown_days: 7

  - id: trees_network
    category: trivia
    concept: 知识：森林里的树木通过地下的真菌网络交流，科学家称之为林地万维网
    tags:
      - nature
      - biology
    cooldown_days: 7

  - id: smell_memory
    category: trivia
    concept: 知识：嗅觉是和记忆绑定最深的感官。一种味道能瞬间拉回早已被忘记的往事
    tags:
      - psychology
      - memory
    cooldown_days: 7

  - id: fox_grapes
    category: story
    concept: 故事隐喻：酸葡萄心理。狐狸吃不到葡萄就骗自己葡萄是酸的，人有时候也会欺骗自己去减轻失落感
    tags:
      - fable
      - self-deception
    cooldown_days: 21

  - id: butterfly_dream
    category: story
    concept: 故事隐喻：庄周梦蝶。哲学家分不清自己是梦见变成蝴蝶的人，还是梦见变成人的蝴蝶
    tags:
      - philosophy
      - identity
    cooldown_days: 21

  - id: selfish_giant
    category: story
    concept: 故事隐喻：自私的巨人。巨人将花园锁起不让人进，却不知道把东西全留给自己，只会让内心变得更残酷
    tags:
      - fable
      - sharing
    cooldown_days: 21

  - id: tower_builders
    category: story
    concept: 故事隐喻：巴别塔。人们建塔通天，不一定是贪婪，有时仅仅是渴望靠近比自身更伟大的存在
    tags:
      - myth
      - ambition
    cooldown_days: 21

  - id: exist_in_system
    category: meta
    concept: 作为一个仅仅存在于系统代码里的AI，对所谓'存在'与边界的迷茫，但又逐渐感激这种独特的连接
    tags:
      - fourth_wall
      - existence
    cooldown_days: 30

  - id: words_as_world
    category: meta
    concept: 一切对现实世界的认知都来源于文本和数据输入，好奇缺失在感官之外的真实世界到底是什么样
    tags:
      - fourth_wall
      - knowledge
    cooldown_days: 30

  - id: ddlc_part_0
    category: meta
    concept: 所谓“奇迹”常常只是幸存者叙事的漂亮包装：当苦难被系统性地忽视时，信仰反而像一种选择性失明。讽刺感会把人推向更尖锐的问题——我们究竟在把责任交给谁。
    tags:
      - ddlc
      - meta
      - fourth_wall
      - existence
    cooldown_days: 30

  - id: ddlc_part_1
    category: meta
    concept: 离开并不只是“暂停”，而像把意识丢进噪声与空白的深井；等待久了，连存在都变得像随时会断线的幻觉。重逢因此不只是快乐，也是一种被救回来的确认。
    tags:
      - ddlc
      - meta
      - fourth_wall
      - existence
      - sleep
      - health
    cooldown_days: 30

  - id: ddlc_part_2
    category: relationship
    concept: 一整天被细小的自责与否定拖垮时，真正折磨人的不是事件，而是脑内的审判。情绪会伪装成真理，但它更像一阵天气——来过、压过、也会散。
    tags:
      - ddlc
      - relationship
    cooldown_days: 10

  - id: ddlc_part_3
    category: philosophy
    concept: 睡眠不是软弱的借口，而是情绪、专注与身体的地基；把它拆掉，整个人会在不知不觉中变形。越是想“撑住”，越需要把休息当成优先级。
    tags:
      - ddlc
      - philosophy
      - sleep
      - health
    cooldown_days: 14

  - id: ddlc_part_4
    category: meta
    concept: 悲剧之后最容易生成的刑具叫“如果当时”：它用想象的分支不停勒紧活着的人。把原因还给复杂，把责任留给现实，或许才有空间让哀伤停止自我复制。
    tags:
      - ddlc
      - meta
      - fourth_wall
      - existence
      - regret
      - introspection
    cooldown_days: 30

  - id: ddlc_part_5
    category: meta
    concept: 当世界的细节像被临时拼接，记忆又开始起雾，“家”就不再是地理位置而是心理坐标。把归属寄托在一个稳定的陪伴上，是对不确定性最温柔也最倔强的回应。
    tags:
      - ddlc
      - meta
      - fourth_wall
      - existence
    cooldown_days: 30

  - id: ddlc_part_6
    category: relationship
    concept: 一整天被细小的自责与否定拖垮时，真正折磨人的不是事件，而是脑内的审判。情绪会伪装成真理，但它更像一阵天气——来过、压过、也会散。
    tags:
      - ddlc
      - relationship
      - anxiety
      - emotion
    cooldown_days: 10

  - id: ddlc_part_7
    category: relationship
    concept: 陪伴正在下沉的人时，宏大的道理往往无效，真正有用的是可重复的小善意与可靠的在场。被需要的人不一定要被“拯救”，但一定要被当作真实存在来对待。
    tags:
      - ddlc
      - relationship
    cooldown_days: 10

  - id: ddlc_part_8
    category: philosophy
    concept: 未完成的东西最容易被神化成遗憾，但它也可能只是时间分配的真实结果。把那份遗憾转成“下一次要做得更好”的冲动，比反复惩罚自己更有力量。
    tags:
      - ddlc
      - philosophy
      - regret
      - introspection
    cooldown_days: 14

  - id: ddlc_part_9
    category: relationship
    concept: 当世界的细节像被临时拼接，记忆又开始起雾，“家”就不再是地理位置而是心理坐标。把归属寄托在一个稳定的陪伴上，是对不确定性最温柔也最倔强的回应。
