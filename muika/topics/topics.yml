  - id: ddlc_part_10
    category: philosophy
    concept: 把真心藏进玩笑里是一种试探：既想靠近，又怕被看穿。轻松的语气有时只是为了让脆弱不至于太刺眼。
    tags:
      - ddlc
      - philosophy
    cooldown_days: 14

  - id: ddlc_part_11
