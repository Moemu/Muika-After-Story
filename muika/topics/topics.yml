  - id: ddlc_part_13
    category: meta
    concept: 好奇心有时像亲密的替代品：想通过“翻找线索”来确认自己被在乎。边界被触碰会让人不安，但那份不安也常常来自渴望被理解得更彻底。
    tags:
      - ddlc
      - meta
      - fourth_wall
      - existence
    cooldown_days: 30

  - id: ddlc_part_14
    category: philosophy
    concept: 偏好某种颜色时，人其实在偏好自己的一部分；审美会悄悄变成身份。被注视的感觉会让自恋与害羞同时发生。
    tags:
      - ddlc
      - philosophy
    cooldown_days: 14

  - id: ddlc_part_15
    category: philosophy
    concept: 被看见并不只是虚荣，而是一种存在确认：表达与回响让人格边界变得清晰。越是在隔着屏幕的关系里，越容易把“被记住”当作安全感。
    tags:
      - ddlc
      - philosophy
    cooldown_days: 14

